name: Build

on:
  push:
    branches:
      - main
      - github-actions
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  PRODUCT_NAME: Akira Multi

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact_name: AkiraMulti-macOS
          - name: Windows
            os: windows-latest
            artifact_name: AkiraMulti-Windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Package macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.artifact_name }}"
          cp -R "build/AkiraMulti_artefacts/${{ env.BUILD_TYPE }}/Standalone/${{ env.PRODUCT_NAME }}.app" "dist/${{ matrix.artifact_name }}/"
          cp -R "build/AkiraMulti_artefacts/${{ env.BUILD_TYPE }}/VST3/${{ env.PRODUCT_NAME }}.vst3" "dist/${{ matrix.artifact_name }}/"
          cp -R "build/AkiraMulti_artefacts/${{ env.BUILD_TYPE }}/AU/${{ env.PRODUCT_NAME }}.component" "dist/${{ matrix.artifact_name }}/"

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.artifact_name }}" | Out-Null
          Copy-Item -Recurse -Force "build/AkiraMulti_artefacts/${{ env.BUILD_TYPE }}/Standalone/${{ env.PRODUCT_NAME }}.exe" "dist/${{ matrix.artifact_name }}/"
          Copy-Item -Recurse -Force "build/AkiraMulti_artefacts/${{ env.BUILD_TYPE }}/VST3/${{ env.PRODUCT_NAME }}.vst3" "dist/${{ matrix.artifact_name }}/"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloaded artifact contents:"
          find release-assets -maxdepth 6 -print

          mkdir -p release-zips
          test -d release-assets/AkiraMulti-macOS
          test -d release-assets/AkiraMulti-Windows

          cmake -E chdir release-assets cmake -E tar cfv ../release-zips/AkiraMulti-macOS.zip --format=zip AkiraMulti-macOS
          cmake -E chdir release-assets cmake -E tar cfv ../release-zips/AkiraMulti-Windows.zip --format=zip AkiraMulti-Windows

          echo "Release zip contents:"
          find release-zips -maxdepth 1 -type f -name "*.zip" -print

          zip_count="$(find release-zips -maxdepth 1 -type f -name "*.zip" | wc -l | tr -d ' ')"

          if [[ "${zip_count}" -eq 0 ]]; then
            echo "No zip files were downloaded from build artifacts."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" release-zips/*.zip --clobber
          else
            gh release create "${{ github.ref_name }}" release-zips/*.zip \
              --title "${{ github.ref_name }}" \
              --notes "Automated Akira Multi build for macOS and Windows."
          fi
