name: Build

on:
  push:
    branches:
      - main
      - github-actions
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  PRODUCT_NAME: Akira Multi

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact_name: AkiraMulti-macOS
            package_name: AkiraMulti-macOS.zip
          - name: Windows
            os: windows-latest
            artifact_name: AkiraMulti-Windows
            package_name: AkiraMulti-Windows.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Package macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cmake -E tar cfv "dist/${{ matrix.package_name }}" --format=zip \
            "build/AkiraMulti_artefacts/${{ env.BUILD_TYPE }}/Standalone/${{ env.PRODUCT_NAME }}.app" \
            "build/AkiraMulti_artefacts/${{ env.BUILD_TYPE }}/VST3/${{ env.PRODUCT_NAME }}.vst3" \
            "build/AkiraMulti_artefacts/${{ env.BUILD_TYPE }}/AU/${{ env.PRODUCT_NAME }}.component"

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          cmake -E tar cfv "dist/${{ matrix.package_name }}" --format=zip `
            "build/AkiraMulti_artefacts/${{ env.BUILD_TYPE }}/Standalone/${{ env.PRODUCT_NAME }}.exe" `
            "build/AkiraMulti_artefacts/${{ env.BUILD_TYPE }}/VST3/${{ env.PRODUCT_NAME }}.vst3"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.package_name }}
          if-no-files-found: error
          archive: false

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloaded artifact contents:"
          find release-assets -maxdepth 6 -print

          mkdir -p release-zips
          find release-assets -type f -name "*.zip" -exec cp "{}" release-zips/ \;

          echo "Release zip contents:"
          find release-zips -maxdepth 1 -type f -name "*.zip" -print

          zip_count="$(find release-zips -maxdepth 1 -type f -name "*.zip" | wc -l | tr -d ' ')"

          if [[ "${zip_count}" -eq 0 ]]; then
            echo "No zip files were downloaded from build artifacts."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-zips/*.zip \
            --title "${{ github.ref_name }}" \
            --notes "Automated Akira Multi build for macOS and Windows."
